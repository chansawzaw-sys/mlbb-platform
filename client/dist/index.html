    <script>
      // Fight for Legendary splash controller — runs once per document
      // load by construction (inline script, no SPA re-execution, no
      // visibility/blur listeners). The app underneath loads normally
      // from t=0; this only manages the overlay + synthesized sting.
      (function () {
        var TOTAL_MS = 3500;
        var BACKUP_MS = 4500;
        var MUTE_KEY = "ffl-splash-muted";
        var reduced = false;
        try {
          reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) {}

        // the 188px sparks box and CONVERGE to its centre (94, 94),
        // arriving as the logo lands.
        var convPos = [
          [8, 20],
          [168, 6],
          [180, 96],
          [150, 172],
          [18, 170],
          [2, 92],
        ];
        for (var c = 0; c < convPos.length; c++) {
          var cx = convPos[c][0] || 0;
          var cy = convPos[c][1] || 0;
          sparks +=
            '<span class="ffs-spark ffs-conv" style="left:' +
            cx +
            "px;top:" +
            cy +
            "px;--dx:" +
            (94 - cx) +
            "px;--dy:" +
            (94 - cy) +
            "px;animation-delay:" +
            (c * 0.06).toFixed(2) +
            's"></span>';
        }
        // After the landing: the classic rising sparks.
        var sparkLeft = [18, 34, 50, 63, 78];
        var sparkDelay = [1.3, 1.5, 1.35, 1.65, 1.45];
        for (var i = 0; i < sparkLeft.length; i++) {
          sparks +=
            '<span class="ffs-spark" style="left:' +
            sparkLeft[i] +
            "%;animation-delay:" +
            sparkDelay[i] +
            's"></span>';
        }

          '<div class="ffs-stage">' +
          '<div class="ffs-logowrap">' +
          '<div class="ffs-glow"></div>' +
          '<img class="ffs-logo" src="./assets/icon-192.png" alt="" />' +
          '<div class="ffs-shine"></div>' +
          '<div class="ffs-sparks">' +
          sparks +
          "</div>" +
          "</div>" +
          '<div class="ffs-namewrap">' +
          '<p class="ffs-name">Fight for Legendary</p>' +
          '<p class="ffs-tag">PLAY • COMPETE • WIN</p>' +
          "</div>" +
          "</div>" +
          '<button type="button" class="ffs-mute" aria-label="Toggle splash sound"></button>';

        function paintMute() {

        }

          lifted = true;

          window.setTimeout(function () {

        window.setTimeout(lift, reduced ? 800 : TOTAL_MS);
        window.setTimeout(lift, BACKUP_MS);

        // ---- Web Audio sting (synthesized, no external file) ----
        var actx = null;
        var master = null;
        var audioStarted = false;
        var audioFailed = false;

        function ensureCtx() {
          try {
            if (!actx) {
              var AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) {
                audioFailed = true;
                return null;
              }
              actx = new AC();
              master = actx.createGain();
              master.gain.value = muted ? 0 : 0.9;
              master.connect(actx.destination);

            return actx;
          } catch (e) {
            audioFailed = true;
            return null;
          }

            var g = actx.createGain();

            g.connect(master);
            osc.start(t0);
            osc.stop(t0 + dur + 0.05);

            src.buffer = buf;
            var filter = actx.createBiquadFilter();
            filter.type = "bandpass";

            g.gain.exponentialRampToValueAtTime(0.22, t0 + dur * 0.7);

            src.connect(filter);
            filter.connect(g);
            g.connect(master);

            src.stop(t0 + dur + 0.05);

            filter.type = "lowpass";
            filter.Q.value = 2;
            filter.frequency.setValueAtTime(240, t0);
            filter.frequency.exponentialRampToValueAtTime(4200, t0 + dur);
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(0.11, t0 + dur * 0.85);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur + 0.05);
            osc.connect(filter);
            osc2.connect(filter);
            filter.connect(g);
            g.connect(master);
            osc.start(t0);
            osc2.start(t0);
            osc.stop(t0 + dur + 0.1);
            osc2.stop(t0 + dur + 0.1);

          tone(783.99, t0 + 0.04, 1.15, "triangle", 0.14);

              o.connect(filter);

          { at: 0.5, play: sndWhoosh },
          { at: 1.2, play: sndBoom },
          { at: 2.0, play: sndGlow },
          { at: 2.8, play: sndChime },

        // grace for the t=0 charge at first paint) is skipped entirely

            var ctx = ensureCtx();
            if (!ctx) return;

              if (ctx.state === "suspended") return; // still blocked; a tap may retry
            }

            var now = ctx.currentTime;

                startAudio();
              }
            }
          });
        }
