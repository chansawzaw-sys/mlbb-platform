    <!-- PWA manifest: a real manifest file (./manifest.json) with real
         PNG icons under ./assets/, so Chrome can offer the native
         install prompt. The manifest, icons and sw.js are static files
         copied into dist by client/build.mjs from client/public/. -->
    <link rel="manifest" href="./manifest.json" />
    <!-- App icon: the same PNG used by the manifest, for the browser
         favicon and for iOS Add to Home Screen. -->
    <link rel="icon" type="image/png" href="/assets/icon-192.png" />
    <link rel="apple-touch-icon" href="/assets/icon-192.png" />
    <title>Fight for Legendary</title>
    <!-- Splash screen (inline): paints before the app bundle arrives so
         every fresh document load opens with the cinematic logo intro.
         All ids/classes are ffs- prefixed to avoid colliding with app
         styles. The overlay always lifts: a 3.5s primary timer, a 4.5s
         backup timeout, and a CSS-only auto-lift at ~4.6s even if the
         controller script never runs. With JavaScript disabled the
         overlay never exists (it is built by the script), so the page
         is never blocked. -->
    <style>
      .ffs-root {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        background:
          radial-gradient(120% 90% at 50% 8%, rgba(243, 210, 122, 0.14), transparent 55%),
          radial-gradient(90% 70% at 50% 42%, #16224f 0%, #0a1128 62%, #070b1e 100%);
        opacity: 1;
        transition: opacity 0.45s ease;
        -webkit-tap-highlight-color: transparent;
        touch-action: none;
        animation: ffs-autolift 0.6s ease 4.6s forwards;
      }
      .ffs-root.ffs-done {
        opacity: 0;
        pointer-events: none;
      }
      @keyframes ffs-autolift {
        to {
          opacity: 0;
          visibility: hidden;
          pointer-events: none;
        }
      }
      .ffs-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        padding: 24px 16px;
        perspective: 900px;
      }
      .ffs-logowrap {
        position: relative;
        width: 168px;
        height: 168px;
        animation: ffs-flyin 0.95s cubic-bezier(0.22, 1.4, 0.36, 1) both;
        will-change: transform, opacity;
      }
      @keyframes ffs-flyin {
        0% {
          opacity: 0;
          transform: translateY(56px) scale(0.25) rotateY(-160deg);
        }
        60% {
          opacity: 1;
          transform: translateY(-8px) scale(1.08) rotateY(14deg);
        }
        80% {
          transform: translateY(2px) scale(0.97) rotateY(-5deg);
        }
        100% {
          opacity: 1;
          transform: translateY(0) scale(1) rotateY(0deg);
        }
      }
      .ffs-glow {
        position: absolute;
        inset: -34px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(243, 210, 122, 0.55) 0%, rgba(243, 210, 122, 0.12) 45%, transparent 70%);
        opacity: 0;
        animation: ffs-glowpulse 1.1s ease-out 0.85s both;
        pointer-events: none;
      }
      @keyframes ffs-glowpulse {
        0% {
          opacity: 0;
          transform: scale(0.6);
        }
        35% {
          opacity: 1;
          transform: scale(1.05);
        }
        100% {
          opacity: 0.25;
          transform: scale(1);
        }
      }
      .ffs-logo {
        position: relative;
        display: block;
        width: 168px;
        height: 168px;
        border-radius: 36px;
        box-shadow: 0 18px 44px rgba(0, 0, 0, 0.55);
      }
      .ffs-shine {
        position: absolute;
        inset: 0;
        border-radius: 36px;
        overflow: hidden;
        pointer-events: none;
      }
      .ffs-shine::after {
        content: "";
        position: absolute;
        top: -20%;
        bottom: -20%;
        left: -70%;
        width: 45%;
        background: linear-gradient(100deg, transparent 0%, rgba(255, 255, 255, 0.55) 50%, transparent 100%);
        transform: skewX(-18deg);
        animation: ffs-shinesweep 0.9s ease-in-out 1.05s both;
      }
      @keyframes ffs-shinesweep {
        from {
          transform: translateX(0) skewX(-18deg);
          opacity: 0;
        }
        20% {
          opacity: 1;
        }
        to {
          transform: translateX(420%) skewX(-18deg);
          opacity: 0;
        }
      }
      .ffs-sparks {
        position: absolute;
        inset: -10px;
        pointer-events: none;
      }
      .ffs-spark {
        position: absolute;
        bottom: 12%;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #f3d27a;
        box-shadow: 0 0 10px 2px rgba(243, 210, 122, 0.65);
        opacity: 0;
        animation: ffs-sparkrise 1.7s ease-out both;
      }
      @keyframes ffs-sparkrise {
        0% {
          opacity: 0;
          transform: translateY(10px) scale(0.5);
        }
        15% {
          opacity: 1;
        }
        100% {
          opacity: 0;
          transform: translateY(-130px) scale(1.1);
        }
      }
      .ffs-name {
        margin: 26px 0 0;
        font-family: system-ui, "Noto Sans Myanmar", "Pyidaungsu", -apple-system, "Segoe UI", sans-serif;
        font-size: 27px;
        font-weight: 800;
        letter-spacing: 0.4px;
        color: #f3d27a;
        text-align: center;
        text-shadow: 0 2px 18px rgba(243, 210, 122, 0.35);
        opacity: 0;
        animation: ffs-namein 0.7s ease-out 1.35s both;
      }
      .ffs-tag {
        margin: 8px 0 0;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        font-size: 12px;
        font-weight: 600;
        letter-spacing: 4px;
        color: #97a1c4;
        text-align: center;
        opacity: 0;
        animation: ffs-namein 0.7s ease-out 1.7s both;
      }
      @keyframes ffs-namein {
        from {
          opacity: 0;
          transform: translateY(14px);
        }
        to {
          opacity: 1;
          transform: translateY(0);
        }
      }
      .ffs-mute {
        position: absolute;
        top: calc(env(safe-area-inset-top, 0px) + 14px);
        right: calc(env(safe-area-inset-right, 0px) + 14px);
        width: 44px;
        height: 44px;
        border-radius: 50%;
        border: 1px solid rgba(243, 210, 122, 0.45);
        background: rgba(10, 17, 40, 0.72);
        color: #f3d27a;
        font-size: 20px;
        line-height: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        padding: 0;
      }
      .ffs-mute:active {
        transform: scale(0.94);
      }
      @media (prefers-reduced-motion: reduce) {
        .ffs-root {
          animation: ffs-autolift 0.3s ease 0.6s forwards;
        }
        .ffs-logowrap,
        .ffs-glow,
        .ffs-shine::after,
        .ffs-spark,
        .ffs-name,
        .ffs-tag {
          animation-duration: 0.01s;
          animation-delay: 0s;
        }
      }
    </style>
    
  <link rel="stylesheet" crossorigin href="./assets/index-ax5sy5xv.css"><script type="module" crossorigin src="./assets/index-kfesx1xd.js"></script></head>
  <body>
    <div
      data-generated-space-root=""
      data-generated-space-slug="mlbb-platform"
    ></div>
    <script>
      // Fight for Legendary splash controller — runs once per document
      // load by construction (inline script, no SPA re-execution, no
      // visibility/blur listeners). The app underneath loads normally
      // from t=0; this only manages the overlay + synthesized sting.
      (function () {
        var TOTAL_MS = 3500;
        var BACKUP_MS = 4500;
        var MUTE_KEY = "ffl-splash-muted";
        var reduced = false;
        try {
          reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
        } catch (e) {}
        var startedAt = Date.now();
        var muted = false;
        try {
          muted = window.localStorage.getItem(MUTE_KEY) === "1";
        } catch (e) {}

        // Build the overlay in JS so a no-JS page is never blocked.
        var root = document.createElement("div");
        root.className = "ffs-root";
        root.setAttribute("role", "presentation");
        root.setAttribute("aria-hidden", "true");
        var sparks = "";
        var sparkLeft = [18, 34, 50, 63, 78];
        var sparkDelay = [1.15, 1.35, 1.05, 1.5, 1.25];
        for (var i = 0; i < sparkLeft.length; i++) {
          sparks +=
            '<span class="ffs-spark" style="left:' +
            sparkLeft[i] +
            "%;animation-delay:" +
            sparkDelay[i] +
            's"></span>';
        }
        root.innerHTML =
          '<div class="ffs-stage">' +
          '<div class="ffs-logowrap">' +
          '<div class="ffs-glow"></div>' +
          '<img class="ffs-logo" src="./assets/icon-192.png" alt="" />' +
          '<div class="ffs-shine"></div>' +
          '<div class="ffs-sparks">' +
          sparks +
          "</div>" +
          "</div>" +
          '<p class="ffs-name">Fight for Legendary</p>' +
          '<p class="ffs-tag">PLAY • COMPETE • WIN</p>' +
          "</div>" +
          '<button type="button" class="ffs-mute" aria-label="Toggle splash sound"></button>';
        document.body.appendChild(root);

        var muteBtn = root.querySelector(".ffs-mute");
        function paintMute() {
          if (muteBtn) muteBtn.textContent = muted ? "\u{1F507}" : "\u{1F50A}";
        }
        paintMute();

        var lifted = false;
        function lift() {
          if (lifted) return;
          lifted = true;
          stopAudio();
          root.classList.add("ffs-done");
          window.setTimeout(function () {
            if (root.parentNode) root.parentNode.removeChild(root);
          }, 550);
        }
        // Primary lift at 3.5s (0.8s under reduced motion) + hard backup.
        window.setTimeout(lift, reduced ? 800 : TOTAL_MS);
        window.setTimeout(lift, BACKUP_MS);

        // ---- Web Audio sting (synthesized, no external file) ----
        var actx = null;
        var master = null;
        var audioStarted = false;
        var audioFailed = false;

        function ensureCtx() {
          try {
            if (!actx) {
              var AC = window.AudioContext || window.webkitAudioContext;
              if (!AC) {
                audioFailed = true;
                return null;
              }
              actx = new AC();
              master = actx.createGain();
              master.gain.value = muted ? 0 : 0.9;
              master.connect(actx.destination);
            }
            return actx;
          } catch (e) {
            audioFailed = true;
            return null;
          }
        }

        function tone(freq, t0, dur, type, vol, glideTo) {
          try {
            var osc = actx.createOscillator();
            var g = actx.createGain();
            osc.type = type;
            osc.frequency.setValueAtTime(freq, t0);
            if (glideTo) {
              osc.frequency.exponentialRampToValueAtTime(glideTo, t0 + dur);
            }
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(vol, t0 + 0.03);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            osc.connect(g);
            g.connect(master);
            osc.start(t0);
            osc.stop(t0 + dur + 0.05);
          } catch (e) {}
        }

        function whoosh(t0, dur) {
          try {
            var len = Math.max(1, Math.floor(actx.sampleRate * dur));
            var buf = actx.createBuffer(1, len, actx.sampleRate);
            var data = buf.getChannelData(0);
            for (var j = 0; j < len; j++) data[j] = Math.random() * 2 - 1;
            var src = actx.createBufferSource();
            src.buffer = buf;
            var filter = actx.createBiquadFilter();
            filter.type = "bandpass";
            filter.Q.value = 1.1;
            filter.frequency.setValueAtTime(320, t0);
            filter.frequency.exponentialRampToValueAtTime(2600, t0 + dur);
            var g = actx.createGain();
            g.gain.setValueAtTime(0.0001, t0);
            g.gain.exponentialRampToValueAtTime(0.22, t0 + dur * 0.7);
            g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
            src.connect(filter);
            filter.connect(g);
            g.connect(master);
            src.start(t0);
            src.stop(t0 + dur + 0.05);
          } catch (e) {}
        }

        function playSting(tailOnly) {
          try {
            if (audioStarted || audioFailed || muted || lifted) return;
            var ctx = ensureCtx();
            if (!ctx) return;
            if (ctx.state === "suspended") {
              var p = ctx.resume();
              if (p && typeof p.catch === "function") p.catch(function () {});
              if (ctx.state === "suspended") return; // still blocked; a tap may retry
            }
            audioStarted = true;
            var t = ctx.currentTime + 0.02;
            if (!tailOnly) {
              // Rising whoosh under the fly-in (0 -> ~0.9s).
              whoosh(t, 0.9);
              // Deep bass impact as the logo lands (~0.9s).
              tone(110, t + 0.88, 0.7, "sine", 0.55, 42);
              tone(55, t + 0.88, 0.85, "triangle", 0.4, 36);
              // Bright shimmer chord on landing (C major add9 sparkle).
              tone(523.25, t + 0.9, 1.1, "triangle", 0.16);
              tone(659.25, t + 0.9, 1.1, "triangle", 0.14);
              tone(783.99, t + 0.92, 1.15, "triangle", 0.14);
              tone(1046.5, t + 0.94, 1.2, "sine", 0.12);
              // Sparkle arpeggio as the particles rise.
              var notes = [1318.5, 1567.98, 2093.0, 1760.0];
              for (var n = 0; n < notes.length; n++) {
                tone(notes[n], t + 1.2 + n * 0.14, 0.5, "sine", 0.1);
              }
            } else {
              // Late tap: short tail — shimmer + a couple of sparkles.
              tone(523.25, t, 0.8, "triangle", 0.15);
              tone(783.99, t + 0.02, 0.85, "triangle", 0.13);
              tone(1046.5, t + 0.04, 0.9, "sine", 0.11);
              tone(1567.98, t + 0.22, 0.5, "sine", 0.09);
              tone(2093.0, t + 0.4, 0.55, "sine", 0.08);
            }
          } catch (e) {
            audioFailed = true;
          }
        }

        function stopAudio() {
          try {
            if (master && actx) {
              master.gain.setTargetAtTime(0, actx.currentTime, 0.03);
            }
          } catch (e) {}
          try {
            if (actx) {
              var c = actx;
              window.setTimeout(function () {
                try {
                  c.close();
                } catch (e) {}
              }, 250);
            }
          } catch (e) {}
        }

        // Attempt the sting at splash start (may stay silent if the
        // browser blocks autoplay — the animation still plays).
        if (!muted && !reduced) playSting(false);

        // Any tap while the splash is up can unlock audio; a tap on
        // the background skips to the end of the splash.
        root.addEventListener("pointerdown", function (ev) {
          if (lifted) return;
          if (ev.target === muteBtn) return;
          if (!audioStarted && !muted && !reduced) {
            var elapsed = Date.now() - startedAt;
            playSting(elapsed > 1800);
            return; // first tap unlocks audio; it does not also skip
          }
          lift();
        });

        if (muteBtn) {
          muteBtn.addEventListener("click", function (ev) {
            ev.stopPropagation();
            muted = !muted;
            try {
              window.localStorage.setItem(MUTE_KEY, muted ? "1" : "0");
            } catch (e) {}
            paintMute();
            if (muted) {
              try {
                if (master && actx) {
                  master.gain.setTargetAtTime(0, actx.currentTime, 0.02);
                }
              } catch (e) {}
            } else if (!lifted && !reduced) {
              if (audioStarted && master && actx) {
                try {
                  master.gain.setTargetAtTime(0.9, actx.currentTime, 0.03);
                } catch (e) {}
              } else if (!audioStarted) {
                var elapsed = Date.now() - startedAt;
                playSting(elapsed > 1800);
              }
            }
          });
        }
      })();
    </script>

      <div style="max-width:720px;margin:0 auto;padding:20px 16px;font-family:system-ui,sans-serif;color:#e8ecf8;background:#070b1e;line-height:1.7">
